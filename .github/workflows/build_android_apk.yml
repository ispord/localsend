name: Build Android APK

on:
  workflow_dispatch:

# 👇 新增：阻止并发的构建堆积（如果连续触发，自动取消旧的，只跑最新的） 👇
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# 👆 -------------------------------------------------------------------- 👆

env:
  FLUTTER_VERSION: "3.50.0"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to build dir
        run: |
          rm -rf $APK_BUILD_DIR
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Decode key.properties
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: echo "$ENCODED_STRING" | base64 -di > app/android/key.properties

      - name: Decode android-keystore.jks
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: mkdir -p secrets && echo "$ENCODED_STRING" | base64 -di > secrets/android-keystore.jks

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: flutter pub get

      # 👇 核心操作：将 Gradle 降级回 8.14.7，彻底绕过 cargokit 的 project.exec 报错 👇
      - name: Downgrade Gradle to 8.14.7 for cargokit compatibility
        run: |
          GRADLE_FILE="${{ env.APK_BUILD_DIR }}/app/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/gradle-9.3.1-all.zip/gradle-8.14.7-all.zip/g' "$GRADLE_FILE"
            echo "Gradle downgraded to 8.14.7."
          fi

      # 👇 补丁 1：修复 device_apps 的 Gradle 问题 👇
      - name: Patch device_apps gradle
        run: |
          DEVICE_APPS_DIR=$(find ~/.pub-cache/git -type d -name "device_apps-*" | head -n 1)
          if [ -n "$DEVICE_APPS_DIR" ]; then
            echo "Found device_apps at: $DEVICE_APPS_DIR"
            sed -i 's/jcenter()/mavenCentral()/g' "$DEVICE_APPS_DIR/android/build.gradle"
            sed -i '1i apply plugin: "com.android.library"' "$DEVICE_APPS_DIR/android/build.gradle"
          fi

      # 👇 补丁 2：自动修复源码中的语法错误 👇
      - name: Patch Dart code errors
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: |
          sed -i 's/FilePicker.clearTemporaryFiles()/FilePicker.platform.clearTemporaryFiles()/g' lib/util/native/cache_helper.dart || true
          sed -i 's/FilePicker.pickFiles/FilePicker.platform.pickFiles/g' lib/pages/wechat_room_page.dart || true
          sed -i 's/FilePicker.getDirectoryPath()/FilePicker.platform.getDirectoryPath()/g' lib/util/native/pick_directory_path.dart || true
          sed -i 's/(_, _)/(context, index)/g' lib/pages/tabs/send_tab.dart || true
          sed -i 's/onPopInvokedWithResult: (_, _)/onPopInvokedWithResult: (bool didPop, Object? result)/g' lib/pages/web_share_page.dart || true
          sed -i 's/(_, _, _)/(context, error, stackTrace)/g' lib/widget/file_thumbnail.dart || true
          sed -i 's/?trailing/trailing!/g' lib/widget/list_tile/custom_list_tile.dart || true
          sed -i 's/?prefix/prefix!/g' lib/widget/copyable_text.dart || true

      # 👇 开始构建（依靠 --android-skip-build-dependency-validation 忽略降级警告） 👇
      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.build.outputs.version }}
          path: ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
