name: Build Android APK

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.50.0"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to build dir
        run: |
          rm -rf $APK_BUILD_DIR
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Decode key.properties
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: echo "$ENCODED_STRING" | base64 -di > app/android/key.properties

      - name: Decode android-keystore.jks
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: mkdir -p secrets && echo "$ENCODED_STRING" | base64 -di > secrets/android-keystore.jks

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: flutter pub get

      # ================= 调试步骤开始 =================
      - name: Debug Android config
        working-directory: ${{ env.APK_BUILD_DIR }}/app/android
        run: |
          echo "=========== SETTINGS.GRADLE ==========="
          cat settings.gradle
          echo "=========== GRADLE-WRAPPER.PROPERTIES ==========="
          cat gradle/wrapper/gradle-wrapper.properties
      # ================= 调试步骤结束 =================

      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.build.outputs.version }}
          path: ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
